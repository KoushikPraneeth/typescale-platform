# AKS uses the ARM64 Standard_D2pds_v5 node available to the Student subscription.
# This immutable ARM64 GHCR image was built/tested from the v1.0.0 source commit;
# the original release digest is AMD64 and must not be scheduled on this node.
# For the ACR pull test, change only repository/digest on the temporary branch,
# observe Argo CD sync, and revert the override after teardown.
app:
  replicaCount: 2
  image:
    repository: ghcr.io/koushikpraneeth/typescale
    tag: 056cb02da9a856793f29796526f5916207d59a04
    digest: sha256:a30631e0fc93269a7d408c7a20c96a6f32c4bd48759fbf78cf13ff803d1b4b27
    pullPolicy: IfNotPresent
  namespacePrefix: typescale:aks
  metrics:
    enabled: true
    path: /metrics
    port: 9090
    allowedNamespace: monitoring
  autoscaling:
    enabled: true
    minReplicaCount: 2
    maxReplicaCount: 5
    pollingInterval: 15
    cooldownPeriod: 300
    fallback:
      failureThreshold: 3
      replicas: 5
      behavior: static
    prometheus:
      serverAddress: http://prometheus-server.monitoring.svc.cluster.local
      jobName: typescale-pods
      query: ""
      threshold: "8"
      activationThreshold: "1"
  publicService:
    enabled: true
    type: LoadBalancer
    port: 80

redis:
  replicaCount: 1
  service:
    port: 6379

networkPolicy:
  enabled: true
