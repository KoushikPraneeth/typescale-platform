name: Azure OIDC to ACR publish proof

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish tested immutable image to temporary ACR
    runs-on: ubuntu-24.04
    environment: azure-demo

    env:
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
      SOURCE_IMAGE: ghcr.io/koushikpraneeth/typescale@sha256:e1e703adcd2da1f293624d29ba5cec378fe875ef3caf411de4568cc3a0aed222

    steps:
      - name: Validate required public identifiers
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_ACR_NAME"
          test -n "$AZURE_ACR_LOGIN_SERVER"
          [[ "$SOURCE_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]

      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Copy immutable image into ACR
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          az acr login --name "$AZURE_ACR_NAME"
          docker pull "$SOURCE_IMAGE"
          target="$AZURE_ACR_LOGIN_SERVER/typescale:$GITHUB_SHA"
          docker tag "$SOURCE_IMAGE" "$target"
          docker push "$target"
          digest=$(az acr manifest show-metadata \
            --registry "$AZURE_ACR_NAME" \
            --name "typescale:$GITHUB_SHA" \
            --query digest -o tsv)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$AZURE_ACR_LOGIN_SERVER/typescale@$digest"
          docker pull "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo "### Azure OIDC → ACR publish verified"
            echo "- Source: $SOURCE_IMAGE"
            echo "- Published and pulled: $image"
            echo "- Tag: commit SHA (immutable digest is the deployment reference)"
          } >> "$GITHUB_STEP_SUMMARY"
