name: Platform validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Helm and GitOps Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0

      - name: Validate Helm release
        run: |
          helm lint --strict charts/typescale -f charts/typescale/values-gitops.yaml
          helm template typescale charts/typescale \
            --namespace typescale-gitops \
            -f charts/typescale/values-gitops.yaml \
            > /tmp/typescale.yaml
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
            -strict -summary -kubernetes-version 1.31.0 - < /tmp/typescale.yaml

      - name: Validate GitOps configuration
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 -m py_compile scripts/update_image.py
          python3 -c 'import re,yaml; values=yaml.safe_load(open("charts/typescale/values-gitops.yaml")); image=values["app"]["image"]; assert re.fullmatch(r"[0-9a-f]{40}", image["tag"]); assert re.fullmatch(r"sha256:[0-9a-f]{64}", image["digest"]); apps=[yaml.safe_load(open(path)) for path in ("argocd/bootstrap.yaml", "argocd/applications/typescale.yaml")]; assert all(app["apiVersion"] == "argoproj.io/v1alpha1" and app["kind"] == "Application" for app in apps); assert apps[1]["spec"]["syncPolicy"]["automated"]["prune"] is True; assert apps[1]["spec"]["syncPolicy"]["automated"]["selfHeal"] is True'
